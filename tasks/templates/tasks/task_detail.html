{% load static %}
{% extends 'base.html' %}

{% block page_title %}{{ task.name }}{% endblock %}

{% block style %}
<style> 
    /* Page-specific styles */
</style>
{% endblock %}

{% block main %}
    <h1>{{ task.name }}</h1>
    <p>Due Date: {{ task.due_date }}</p>
    {% if task.task_image %}
        <img src="{{ task.task_image.url }}" alt="Task Image">
    {% endif %}
{% endblock %}
