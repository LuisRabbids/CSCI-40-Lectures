<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Task List</title>
</head>
<body>
    <h1>Task List</h1>

    {% block content %}
        <form method="post">
            {% csrf_token %}
            {{ form }}
            <input type="submit" value="Submit">
        </form>
    {% endblock %}

    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ul>
</body>
</html>
