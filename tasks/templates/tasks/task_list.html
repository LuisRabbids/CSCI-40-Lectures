<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Task List</title>
</head>
<body>
    <h1>Task List</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>

    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ul>
</body>
</html>
