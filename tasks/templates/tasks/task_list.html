<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Task List</title>
</head>
<body>
    <h1>Task List</h1>
    <ul>
        {% for task in tasks %}
            <li>{{ task }}</li>
        {% endfor %}
    </ul>
    <!-- Clickable links -->
    <a href="{% url 'tasks:add-task' %}">Add a New Task</a> | 
    <a href="{% url 'tasks:completed-tasks' %}">View Completed Tasks</a>
</body>
</html>
